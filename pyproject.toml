[project]
name = "mlflow-practice"
version = "0.1.0"
description = "Example projects and snippets demonstrating MLflow usage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel", email = "daniel@example.com" }
]
keywords = ["mlflow", "examples", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "hydra-core==1.3",
    "scikit-learn",
    "xgboost",
    "mlflow",
    "polars",
    "psycopg2-binary",
    "boto3",
    "stable-baselines3",
    "torch",
    "torchvision",
    "python-dotenv",
    "awscli",
    "typer",
    "loguru",
    "tqdm",
    "swig>=4.4.1",
    "gymnasium[box2d]>=1.2.3",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
]

[project.urls]
"Homepage" = "https://github.com/your-org/mlflow-examples"
"Repository" = "https://github.com/your-org/mlflow-examples"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
